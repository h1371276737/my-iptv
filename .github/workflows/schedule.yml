name: update schedule

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent) >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml' }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - run: pnpm m3u

      # ========== 关键修复：在部署前删除大文件 ==========
      - name: Remove oversized epg files
        run: |
          echo "=== Before removal ==="
          find . -name "epg_pw.xml" -type f -exec ls -lh {} \;
          
          # 强力删除所有 epg_pw.xml 文件
          find . -name "epg_pw.xml" -type f -delete
          
          # 同时检查 epg 目录是否有其他大文件
          echo "=== EPG directory contents ==="
          ls -lh epg/ 2>/dev/null || echo "No epg/ dir in root"
          find . -path "*/epg/*" -type f -exec ls -lh {} \;
          
          echo "=== After removal ==="
          find . -name "epg_pw.xml" -type f || echo "Successfully removed"

      - run: sudo apt-get install -y tree

      - name: Publish m3u to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            pnpm static
            tree m3u
            
            # 再次确认大文件已被删除
            find m3u -name "epg_pw.xml" -type f -exec rm -f {} \;
            
            # 检查最终大小
            echo "=== Final site size check ==="
            du -sh m3u/
            echo "=== Files over 20MB ==="
            find m3u -type f -size +20M -exec ls -lh {} \; || echo "None found"
            
            npx wrangler pages deploy m3u --project-name="${PROJECT_NAME}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: schedule refresh (trigger Cloudflare Pages build)"
            git push
          fi

      # - name: "Jekyll theme"
